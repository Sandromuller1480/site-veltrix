  </defs>
  <rect width="800" height="500" fill="url(#tl-bg)"/>
  <circle cx="680" cy="140" r="250" fill="rgba(139,92,246,0.1)" filter="blur(60px)"/>
  <circle cx="120" cy="360" r="200" fill="rgba(0,200,255,0.1)" filter="blur(60px)"/>

